<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 650" role="img" aria-labelledby="title desc">
<title id="title">Bible and World History Timeline</title><desc id="desc">Earlier events are on the left; later events are on the right</desc>
<style>
text{font-family:Arial,'Noto Sans KR',sans-serif;fill:#111}.title{font-size:42px;font-weight:800}.sub{font-size:22px;fill:#555}.era{font-size:26px;font-weight:800}.name{font-size:21px;font-weight:750}.date{font-size:17px;fill:#555}.small{font-size:17px;font-weight:700;letter-spacing:.08em}.book{font-size:19px}.line{stroke:#111;stroke-width:5}.tick{stroke:#111;stroke-width:3}.soft{fill:#f1f1ef;stroke:#bbb;stroke-width:2}.dark{fill:#111}.white{fill:#fff}
</style>
<rect width="1600" height="650" fill="#fff"/><text class="title" x="70" y="70">Bible and World History Timeline</text><text class="sub" x="70" y="108">Earlier events are on the left; later events are on the right</text>
<text class="era" x="650" y="155" text-anchor="middle">Before Christ · B.C.</text><text class="era" x="1160" y="155" text-anchor="middle">Anno Domini · A.D.</text>
<line class="line" x1="65" y1="310" x2="1540" y2="310"/><path d="M1540 310l-24-15v30z" class="dark"/><line class="tick" x1="90" y1="310" x2="90" y2="250"/><circle cx="90" cy="310" r="9" class="dark"/><text class="name" text-anchor="middle" x="90" y="195">Creation</text><text class="date" text-anchor="middle" x="90" y="225"></text><line class="tick" x1="225" y1="310" x2="225" y2="370"/><circle cx="225" cy="310" r="9" class="dark"/><text class="name" text-anchor="middle" x="225" y="425">Adam</text><text class="date" text-anchor="middle" x="225" y="455"></text><line class="tick" x1="370" y1="310" x2="370" y2="250"/><circle cx="370" cy="310" r="9" class="dark"/><text class="name" text-anchor="middle" x="370" y="195">Abraham</text><text class="date" text-anchor="middle" x="370" y="225">c. 2000 B.C.</text><line class="tick" x1="510" y1="310" x2="510" y2="370"/><circle cx="510" cy="310" r="9" class="dark"/><text class="name" text-anchor="middle" x="510" y="425">Moses</text><text class="date" text-anchor="middle" x="510" y="455">c. 1500 B.C.</text><line class="tick" x1="650" y1="310" x2="650" y2="250"/><circle cx="650" cy="310" r="9" class="dark"/><text class="name" text-anchor="middle" x="650" y="195">David</text><text class="date" text-anchor="middle" x="650" y="225">c. 1000 B.C.</text><line class="tick" x1="790" y1="310" x2="790" y2="370"/><circle cx="790" cy="310" r="9" class="dark"/><text class="name" text-anchor="middle" x="790" y="425">Babylonian exile</text><text class="date" text-anchor="middle" x="790" y="455">586 B.C.</text><line class="tick" x1="930" y1="310" x2="930" y2="250"/><circle cx="930" cy="310" r="9" class="dark"/><text class="name" text-anchor="middle" x="930" y="195">Jesus Christ</text><text class="date" text-anchor="middle" x="930" y="225">turn of the era</text><line class="tick" x1="1120" y1="310" x2="1120" y2="370"/><circle cx="1120" cy="310" r="9" class="dark"/><text class="name" text-anchor="middle" x="1120" y="425">Columbus&#x27;s voyage</text><text class="date" text-anchor="middle" x="1120" y="455">A.D. 1492</text><line class="tick" x1="1335" y1="310" x2="1335" y2="250"/><circle cx="1335" cy="310" r="9" class="dark"/><text class="name" text-anchor="middle" x="1335" y="195">Moon landing</text><text class="date" text-anchor="middle" x="1335" y="225">A.D. 1969</text><line class="tick" x1="1510" y1="310" x2="1510" y2="370"/><circle cx="1510" cy="310" r="9" class="dark"/><text class="name" text-anchor="middle" x="1510" y="425">Present</text><text class="date" text-anchor="middle" x="1510" y="455">A.D.</text>
<rect class="soft" x="65" y="525" width="865" height="64"/><rect class="dark" x="930" y="525" width="610" height="64"/>
<text class="era" x="497" y="566" text-anchor="middle">Old Testament era</text><text class="era white" x="1235" y="566" text-anchor="middle">New Testament era</text>
<text class="small" x="65" y="625">EARLIER</text><text class="small" x="1540" y="625" text-anchor="end">LATER</text></svg>